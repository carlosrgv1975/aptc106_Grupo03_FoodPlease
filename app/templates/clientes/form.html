{% extends 'base.html' %}
{% block title %}{{ 'Editar' if cliente else 'Nuevo' }} cliente{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if cliente else 'Nuevo' }} cliente</h1>
<form method="post" class="card card-body shadow-sm">
    <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" value="{{ cliente.nombre if cliente else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Teléfono</label><input name="telefono" class="form-control" value="{{ cliente.telefono if cliente else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Dirección</label><input name="direccion" class="form-control" value="{{ cliente.direccion if cliente else '' }}" required></div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('clientes.list_clientes') }}" class="btn btn-outline-secondary">Volver</a>
    </div>
</form>
{% endblock %}
