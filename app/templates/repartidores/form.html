{% extends 'base.html' %}
{% block title %}{{ 'Editar' if repartidor else 'Nuevo' }} repartidor{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if repartidor else 'Nuevo' }} repartidor</h1>
<form method="post" class="card card-body shadow-sm">
    <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" value="{{ repartidor.nombre if repartidor else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Teléfono</label><input name="telefono" class="form-control" value="{{ repartidor.telefono if repartidor else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Vehículo</label><input name="vehiculo" class="form-control" value="{{ repartidor.vehiculo if repartidor else '' }}" required></div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="disponible" id="disponible" {% if not repartidor or repartidor.disponible %}checked{% endif %}>
        <label class="form-check-label" for="disponible">Disponible</label>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('repartidores.list_repartidores') }}" class="btn btn-outline-secondary">Volver</a>
    </div>
</form>
{% endblock %}
