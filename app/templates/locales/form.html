{% extends 'base.html' %}
{% block title %}{{ 'Editar' if local else 'Nuevo' }} local{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if local else 'Nuevo' }} local</h1>
<form method="post" class="card card-body shadow-sm">
    <div class="mb-3"><label class="form-label">Nombre</label><input name="nombre" class="form-control" value="{{ local.nombre if local else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Rubro</label><input name="rubro" class="form-control" value="{{ local.rubro if local else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Dirección</label><input name="direccion" class="form-control" value="{{ local.direccion if local else '' }}" required></div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('locales.list_locales') }}" class="btn btn-outline-secondary">Volver</a>
    </div>
</form>
{% endblock %}
