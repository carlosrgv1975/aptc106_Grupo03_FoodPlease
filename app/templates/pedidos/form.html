{% extends 'base.html' %}
{% block title %}{{ 'Editar' if pedido else 'Nuevo' }} pedido{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar' if pedido else 'Nuevo' }} pedido</h1>
<form method="post" class="card card-body shadow-sm">
    <div class="mb-3"><label class="form-label">Descripción</label><input name="descripcion" class="form-control" value="{{ pedido.descripcion if pedido else '' }}" required></div>
    <div class="mb-3"><label class="form-label">Dirección de entrega</label><input name="direccion_entrega" class="form-control" value="{{ pedido.direccion_entrega if pedido else '' }}" required></div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Cliente</label>
            <select name="cliente_id" class="form-select" required>
                <option value="">Seleccione</option>
                {% for cliente in clientes %}
                <option value="{{ cliente.id }}" {% if pedido and pedido.cliente_id == cliente.id %}selected{% endif %}>{{ cliente.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Local</label>
            <select name="local_id" class="form-select" required>
                <option value="">Seleccione</option>
                {% for local in locales %}
                <option value="{{ local.id }}" {% if pedido and pedido.local_id == local.id %}selected{% endif %}>{{ local.nombre }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Repartidor</label>
            <select name="repartidor_id" class="form-select">
                <option value="">Sin asignar</option>
                {% for repartidor in repartidores %}
                <option value="{{ repartidor.id }}" {% if pedido and pedido.repartidor_id == repartidor.id %}selected{% endif %}>{{ repartidor.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select" required>
                {% for estado in estados %}
                <option value="{{ estado }}" {% if pedido and pedido.estado == estado %}selected{% elif not pedido and estado == 'Pendiente' %}selected{% endif %}>{{ estado }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Total</label>
            <input type="number" step="0.01" min="1" name="total" class="form-control" value="{{ pedido.total if pedido else '' }}" required>
        </div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a href="{{ url_for('pedidos.list_pedidos') }}" class="btn btn-outline-secondary">Volver</a>
    </div>
</form>
{% endblock %}
