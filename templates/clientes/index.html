{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👤 Clientes</h2>
    <a href="/clientes/nuevo" class="btn btn-danger">+ Nuevo Cliente</a>
</div>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr><th>#</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Dirección</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                {% for c in clientes %}
                <tr>
                    <td>{{ c.id }}</td><td>{{ c.nombre }}</td><td>{{ c.email }}</td>
                    <td>{{ c.telefono }}</td><td>{{ c.direccion }}</td>
                    <td>
                        <a href="/clientes/editar/{{ c.id }}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="/clientes/eliminar/{{ c.id }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar?')">Eliminar</a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="6" class="text-center text-muted py-3">No hay clientes.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
