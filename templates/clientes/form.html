{% extends 'base.html' %}
{% block content %}
<h2>👤 {% if cliente %}Editar Cliente{% else %}Nuevo Cliente{% endif %}</h2>
<div class="card shadow-sm mt-3">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" name="nombre" class="form-control" required
                       value="{{ cliente.nombre if cliente else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required
                       value="{{ cliente.email if cliente else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" required
                       value="{{ cliente.telefono if cliente else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" class="form-control" required
                       value="{{ cliente.direccion if cliente else '' }}">
            </div>
            <button type="submit" class="btn btn-danger">Guardar</button>
            <a href="/clientes" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
