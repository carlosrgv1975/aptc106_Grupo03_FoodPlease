{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>🏪 Locales</h2>
    <a href="/locales/nuevo" class="btn btn-danger">+ Nuevo Local</a>
</div>
<div class="card shadow-sm">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead class="table-dark">
                <tr><th>#</th><th>Nombre</th><th>Categoría</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr>
            </thead>
            <tbody>
                {% for l in locales %}
                <tr>
                    <td>{{ l.id }}</td><td>{{ l.nombre }}</td><td>{{ l.categoria }}</td>
                    <td>{{ l.direccion }}</td><td>{{ l.telefono }}</td>
                    <td>
                        <a href="/locales/editar/{{ l.id }}" class="btn btn-sm btn-warning">Editar</a>
                        <a href="/locales/eliminar/{{ l.id }}" class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Eliminar?')">Eliminar</a>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="6" class="text-center text-muted py-3">No hay locales.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
